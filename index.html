<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talents Meet</title>
<meta name="theme-color" content="#1f2f7a">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{
  /* SADA palette — light */
  --bg:#eef4f8; --surface:#ffffff; --text:#16224f; --muted:#56637f; --line:#d3dfe9;
  --navy:#1f2f7a; --teal:#0f6b68; --rose:#b0175f;
  --pri:#1f2f7a; --pri-ink:#ffffff; --chip-ink:#ffffff;
  --ok:#1f8a54; --ok-ink:#ffffff; --warn:#9a6b00; --bad:#c0392b; --bad-ink:#ffffff;
  --panel:color-mix(in srgb,var(--surface) 55%,transparent);
  --card:color-mix(in srgb,var(--surface) 52%,transparent);
  --display:"Marcellus",Georgia,"Times New Roman",serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1428; --surface:#17224a; --text:#e7ecf8; --muted:#a3afc9; --line:#26345c;
  --navy:#a9bbff; --teal:#5fd1c9; --rose:#f07aae;
  --pri:#a9bbff; --pri-ink:#0d1428; --chip-ink:#06201e;
  --ok:#5fbf8a; --ok-ink:#06210f; --warn:#e0b04b; --bad:#e07a6b; --bad-ink:#2a0b06; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1428; --surface:#17224a; --text:#e7ecf8; --muted:#a3afc9; --line:#26345c;
  --navy:#a9bbff; --teal:#5fd1c9; --rose:#f07aae;
  --pri:#a9bbff; --pri-ink:#0d1428; --chip-ink:#06201e;
  --ok:#5fbf8a; --ok-ink:#06210f; --warn:#e0b04b; --bad:#e07a6b; --bad-ink:#2a0b06; color-scheme:dark}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(40vmax 40vmax at 8% 12%,color-mix(in srgb,var(--teal) 22%,transparent),transparent 70%),
             radial-gradient(38vmax 38vmax at 92% 30%,color-mix(in srgb,var(--rose) 16%,transparent),transparent 70%),
             radial-gradient(45vmax 45vmax at 50% 100%,color-mix(in srgb,var(--navy) 18%,transparent),transparent 70%)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--body);isolation:isolate;-webkit-tap-highlight-color:transparent}
.serif{font-family:var(--display)}
button{font:inherit;cursor:pointer}
.screen{display:none;min-height:100vh;min-height:100dvh}
.screen.on{display:flex}
/* splash */
#splash{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;
  background:radial-gradient(90% 60% at 50% 0%,color-mix(in srgb,var(--teal) 18%,transparent),transparent 75%)}
.kicker{font-size:12px;letter-spacing:.18em;color:var(--muted);font-weight:700}
.portal{font-family:var(--display);color:var(--rose);font-size:19px;margin-top:6px}
.logo-ring{width:190px;height:190px;border-radius:50%;margin:34px 0 26px;padding:6px;
  background:conic-gradient(from 200deg,var(--teal) 0 28%,transparent 28% 100%);position:relative}
.logo-ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid color-mix(in srgb,var(--teal) 55%,transparent)}
.logo-ring img{width:100%;height:100%;border-radius:50%;display:block;background:#fff;object-fit:cover;box-shadow:0 0 0 4px var(--bg)}
#splash h1{font-family:var(--display);font-weight:400;font-size:38px;margin:0 0 10px;color:var(--navy);letter-spacing:.04em}
.motto{font-family:var(--display);font-style:italic;color:var(--muted);margin:0 0 30px}
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:700;background:var(--pri);color:var(--pri-ink)}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--navy);font-weight:600}
.copy{margin-top:40px;font-size:12px;color:var(--muted)}
/* login */
#login{flex-direction:column;justify-content:center;padding:24px 22px;max-width:480px;margin:0 auto}
#login h2{font-family:var(--display);font-weight:400;color:var(--navy);text-align:center;font-size:30px;margin:0 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 26px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:13px 14px;font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 2px color-mix(in srgb,var(--teal) 25%,transparent)}
textarea{min-height:80px;resize:vertical}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
.full{width:100%;margin-top:22px}
.center{text-align:center;margin-top:16px}
/* app */
#app{flex-direction:column;height:100vh;height:100dvh;overflow:hidden;position:relative}
.top{background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:0;z-index:2}
.top h3{margin:0;font-family:var(--display);font-weight:400;font-size:21px;color:var(--navy)}
.link{background:none;border:0;color:var(--teal);font-weight:700;font-size:14px;padding:4px}
.main{flex:1;overflow-y:auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom,0px));max-width:680px;width:100%;margin:0 auto}
.group{color:var(--muted);font-size:14px;margin:16px 2px 8px}
.card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;color:inherit}
button.card:active{background:color-mix(in srgb,var(--teal) 10%,transparent)}
.nm{font-family:var(--display);font-size:17px;color:var(--navy)}
.id{font-size:12px;color:var(--muted);margin-top:3px}
.chip{background:var(--teal);color:var(--chip-ink);font-weight:700;font-size:12px;padding:3px 10px;border-radius:20px;white-space:nowrap}
.done{font-size:11px;color:var(--ok);margin-top:3px}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;
  display:flex;gap:4px;padding:4px;max-width:560px;margin:0 auto;
  background:color-mix(in srgb,var(--surface) 45%,transparent);border:1px solid var(--line);border-radius:999px;
  box-shadow:0 10px 30px rgba(15,25,60,.22);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%)}
.tabs button{flex:1;background:none;border:0;border-radius:999px;color:var(--text);padding:4px 0 3px;font-size:12px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .18s,color .18s}
.tabs button.on{color:var(--teal);background:color-mix(in srgb,var(--teal) 16%,transparent)}
.tabs svg{width:20px;height:20px}
.res{display:block}
.res .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:5px;gap:12px}
.res .row span:last-child{color:var(--text);text-align:right}
.res .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px}
.note{font-size:12px;color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:8px;padding:8px 10px;margin:8px 0}
/* sheet */
.sheet{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.on{display:flex}
.sheet .box{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:8px 14px;font-size:14px}
.opt.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:700}
.del{background:none;border:0;color:var(--bad);font-size:12px;padding:6px 0 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ok);color:var(--ok-ink);padding:10px 18px;border-radius:20px;font-weight:700;display:none;z-index:20}
@media (prefers-reduced-motion:no-preference){.sheet .box{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
.scanrow{display:flex;gap:8px;align-items:stretch;margin-top:4px}
.scanrow input{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em}
.cam{background:var(--pri);border:0;border-radius:8px;width:54px;display:flex;align-items:center;justify-content:center;color:var(--pri-ink)}
.cam svg{width:26px;height:26px}
.sugg{margin-top:6px}
.sugg button{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 12px;margin-bottom:6px;font-size:14px}
.sugg small{color:var(--muted);margin-left:6px}
input[readonly]{color:var(--muted);background:color-mix(in srgb,var(--bg) 70%,transparent)}
.req{color:var(--rose)}
.formcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px 16px;margin-top:14px}
.btnrow{display:flex;gap:10px;margin-top:20px}.btnrow .btn{flex:1}
#scanner{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column}
#scanner.on{display:flex}
#scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
.frame{position:absolute;left:10%;right:10%;top:35%;height:22%;border:3px solid #5fd1c9;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
.scanbar{padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:#000;text-align:center}
.scanmsg{color:#ddd;font-size:14px;margin-bottom:12px;min-height:20px}
.entries{display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px}
.danger{background:var(--bad);color:var(--bad-ink)}
.who{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;padding:14px;margin:6px 0 4px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
</head>

<script>
const PROGRAMS=["Supplication","Qira'th","Welcome Speech","Presidency","Inauguration","Report","Malayalam Speech","Spiritual Talk","Arabic Speech","English Speech","Urdu Speech","Song","Zero Hour","Other"];
const TIMES=["Finished","Not Finished","Over Time"];
const JUDGES=["Very Poor","Poor","Average","Amazing","Just Awesome"];
const VALS=["1/10","2/10","3/10","4/10","5/10","6/10","7/10","8/10","9/10","10/10"];
const CLASSES=["Degree 1","Plus Two","Plus One"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tab="students",q="",evals=[],loaded=false,STUDENTS=[],role="",me=null,cred=null,pendingRole="",evalId="",evalStudent=null,poll=null;

const API_URL="https://script.google.com/macros/s/AKfycbzmEQWkmiGs-QqkJM1qVEFcWyxTO0jERK_hrHfdNZ1qOkKFJ31Bg_sf7zdtSlJ9IGRaJw/exec";
async function api(fn,...args){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args})});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||"Error");
  return j.data;
}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));}
function saveSess(){try{localStorage.setItem("tm_sess",JSON.stringify(cred))}catch(e){}}
function clearSess(){try{localStorage.removeItem("tm_sess")}catch(e){}}
function loadSess(){try{return JSON.parse(localStorage.getItem("tm_sess")||"null")}catch(e){return null}}
function toast(t){const el=$("#toast");el.textContent=t;el.style.display="block";setTimeout(()=>el.style.display="none",1600)}

async function refresh(){
  try{evals=await api("getResults",cred);loaded=true;if($("#app").classList.contains("on")&&tab!=="evaluate")render();}catch(e){}
}
function enterApp(r){
  role=r.role;me=r.me;STUDENTS=r.students||[];
  const isUser=role==="user";
  $(".tabs").style.display=isUser?"none":"flex";
  $("#adminTab").style.display=role==="admin"?"flex":"none";
  tab=isUser?"mine":"students";q="";loaded=false;evals=[];
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.t===tab));
  show("app");render();refresh();
  clearInterval(poll);poll=setInterval(refresh,20000);
}
document.querySelectorAll("[data-role]").forEach(b=>b.onclick=async()=>{
  const s=loadSess();
  if(s&&s.role===b.dataset.role){try{cred=s;enterApp(await api("login",s));return}catch(e){clearSess()}}
  pendingRole=b.dataset.role;
  $("#roleName").textContent={admin:"Admin Entry",staff:"Staff Entry",user:"User Entry"}[pendingRole];
  $("#roleHint").textContent=pendingRole==="user"?"Username is your number in class. Password is your full name.":"Only recognised evaluators can enter student records.";
  $("#u").value="";$("#p").value="";$("#lerr").textContent="";
  $("#u").inputMode=pendingRole==="user"?"numeric":"text";
  show("login");
});
$("#back").onclick=()=>show("splash");
$("#doLogin").onclick=async()=>{
  const c={role:pendingRole,u:$("#u").value.trim(),p:$("#p").value};
  const btn=$("#doLogin");btn.disabled=true;btn.textContent="Checking…";$("#lerr").textContent="";
  try{const r=await api("login",c);cred=c;saveSess();$("#p").value="";enterApp(r);}
  catch(e){$("#lerr").textContent="Wrong username or password.";}
  btn.disabled=false;btn.textContent="Log in";
};
$("#p").addEventListener("keydown",e=>{if(e.key==="Enter")$("#doLogin").click()});
$("#logout").onclick=()=>{clearInterval(poll);role="";me=null;cred=null;clearSess();evalId="";evalStudent=null;show("splash");};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;q="";document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));render();$("#main").scrollTop=0;if(tab!=="evaluate")refresh();});

function resultCard(e,canDel){
  return `<div class="card res"><div class="head"><div><div class="nm">${esc(e.name)}</div><div class="id">${esc(e.sid)} · ${esc(e.cls)}</div></div><span class="chip">${esc(e.valuation)}</span></div>
    <div class="row"><span>Program</span><span>${esc(e.program)}</span></div>
    <div class="row"><span>Time management</span><span>${esc(e.time)}</span></div>
    <div class="row"><span>Judgement</span><span>${esc(e.judgement)}</span></div>
    <div class="row"><span>Valuation</span><span>${esc(e.valuation)}</span></div>
    <div class="row"><span>Note</span><span>${esc(e.note||"-")}</span></div>
    <div class="row"><span>Recorded</span><span>${new Date(e.at).toLocaleString()}</span></div>
    ${canDel?`<button class="del" data-del="${esc(e._id)}">Delete</button>`:""}</div>`;
}
function searchBox(ph){return `<input id="q" placeholder="${ph}" value="${esc(q)}" style="margin-top:4px">`}
function match(s){const t=q.trim().toLowerCase();return !t||s.name.toLowerCase().includes(t)||s.id.toLowerCase().includes(t)}
function bindSearch(){const i=$("#q");if(!i)return;i.oninput=()=>{q=i.value;const p=i.selectionStart;render();const j=$("#q");j.focus();j.setSelectionRange(p,p)}}
function studentList(){
  let h="";
  for(const c of CLASSES){
    const list=STUDENTS.filter(s=>s.cls===c&&match(s));
    if(!list.length)continue;
    h+=`<div class="group">${c} (${list.length})</div>`+list.map(s=>`<div class="card"><div><div class="nm">${esc(s.name)}</div><div class="id">${s.id}</div></div><span class="chip">${c}</span></div>`).join("");
  }
  return h||`<div class="empty">No student found.</div>`;
}
function render(){
  const m=$("#main");
  if(tab==="mine"){
    $("#ttl").textContent="My Result";
    const mine=evals.slice().sort((a,b)=>b.at-a.at);
    m.innerHTML=`<div class="who"><div class="nm" style="font-size:19px">${esc(me.name)}</div><div class="id">${me.id} · ${me.cls}</div></div>`+
      (!loaded?`<div class="empty">Loading…</div>`:mine.length?mine.map(e=>resultCard(e,false)).join(""):`<div class="empty">No result yet.</div>`);
    return;
  }
  if(tab==="admin"&&role==="admin"){
    $("#ttl").textContent="Admin";
    m.innerHTML=`<div class="who"><div class="nm">Saved results</div><div class="id" style="font-size:15px;margin-top:6px">${loaded?evals.length:"…"}</div></div>
      <div class="who"><div class="nm">Reset data</div><p class="sub" style="margin:6px 0 12px">Deletes every saved result. Student list is not changed.</p>
      <button class="btn danger full" id="resetBtn" style="margin-top:0">Reset all results</button></div>`;
    $("#resetBtn").onclick=resetAll;return;
  }
  if(tab==="students"){$("#ttl").textContent="Students";m.innerHTML=searchBox("Search by name or ID")+studentList();}
  else if(tab==="evaluate"){$("#ttl").textContent="Evaluate Program";m.innerHTML=evalView();bindEval();return;}
  else{$("#ttl").textContent="Check Result";
    const t=q.trim().toLowerCase();
    const list=evals.filter(e=>!t||e.name.toLowerCase().includes(t)||e.sid.toLowerCase().includes(t)||e.program.toLowerCase().includes(t)).sort((a,b)=>b.at-a.at);
    m.innerHTML=searchBox("Search result by name or ID")+(!loaded?`<div class="empty">Loading…</div>`:list.length?list.map(e=>resultCard(e,role==="admin")).join(""):`<div class="empty">No results yet.</div>`);
    m.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delEval(b.dataset.del));
  }
  bindSearch();
}
async function delEval(id){
  if(!confirm("Delete this result?"))return;
  try{await api("deleteResult",cred,id);toast("Deleted");refresh();}catch(e){alert("Could not delete.")}
}
async function resetAll(){
  if(!confirm("Delete ALL results? This cannot be undone."))return;
  if(prompt("Type RESET to confirm")!=="RESET")return;
  const b=$("#resetBtn");b.disabled=true;b.textContent="Deleting…";
  try{await api("resetAll",cred);evals=[];toast("All results deleted");}catch(e){alert("Could not reset.")}
  render();
}

function sel(id,arr){return `<select id="${id}"><option value="">Select</option>${arr.map(v=>`<option>${esc(v)}</option>`).join("")}</select>`}
function findStudent(v){v=String(v||"").trim().toUpperCase();if(!v)return null;
  const ex=STUDENTS.find(s=>s.id===v);if(ex)return ex;
  const m=v.match(/^[A-Z]{6,}(\d{5,})$/);if(!m)return null;
  const n=parseInt(m[1],10);return STUDENTS.find(s=>parseInt(s.id.replace(/\D/g,""),10)===n)||null}
function evalView(){
  const camIcon=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`;
  return `<label for="eid" style="margin-top:6px">Student ID</label>
  <div class="scanrow"><input id="eid" placeholder="Scan barcode or type ID" value="${esc(evalId)}" autocapitalize="characters" autocomplete="off"><button class="cam" id="camBtn" aria-label="Scan barcode">${camIcon}</button></div>
  <div class="err" id="iderr"></div><div class="sugg" id="sugg"></div>
  ${evalStudent?`<div class="formcard">
    <label for="fprog">Performed Program <span class="req">*</span></label>${sel("fprog",PROGRAMS)}
    <label for="ftime">Time Management <span class="req">*</span></label>${sel("ftime",TIMES)}
    <label for="fjudge">Judgement <span class="req">*</span></label>${sel("fjudge",JUDGES)}
    <label for="fval">Valuation <span class="req">*</span></label>${sel("fval",VALS)}
    <label for="fnote">Additional Note</label><textarea id="fnote" placeholder="Optional"></textarea>
    <label for="fname">Student Name</label><input id="fname" readonly value="${esc(evalStudent.name)}">
    <div class="err" id="ferr"></div>
    <div class="btnrow"><button class="btn ghost" id="fcancel">Cancel</button><button class="btn" id="fsave">Save</button></div>
  </div>`:`<div class="empty">Tap the camera and scan the student's barcode.</div>`}`;
}
function setStudent(v){
  evalId=String(v||"").trim().toUpperCase();evalStudent=findStudent(evalId);render();
  if(!evalStudent&&evalId)$("#iderr").textContent="No student with this ID: "+evalId;
}
function bindEval(){
  const inp=$("#eid");
  inp.oninput=()=>{
    const v=inp.value.trim().toUpperCase();evalId=inp.value;
    if(findStudent(v)){setStudent(v);return}
    if(evalStudent){evalStudent=null;const p=inp.selectionStart;render();const j=$("#eid");j.focus();j.setSelectionRange(p,p);}
    const sg=$("#sugg");const l=v.toLowerCase();
    const list=l.length>=2?STUDENTS.filter(s=>s.id.toLowerCase().includes(l)||s.name.toLowerCase().includes(l)).slice(0,5):[];
    sg.innerHTML=list.map(s=>`<button data-id="${s.id}">${esc(s.id)}<small>${esc(s.name)}</small></button>`).join("");
    sg.querySelectorAll("button").forEach(b=>b.onclick=()=>setStudent(b.dataset.id));
  };
  $("#camBtn").onclick=startScan;
  if(!evalStudent)return;
  $("#fcancel").onclick=()=>{evalId="";evalStudent=null;render()};
  $("#fsave").onclick=async()=>{
    const d={sid:evalStudent.id,program:$("#fprog").value,time:$("#ftime").value,judgement:$("#fjudge").value,valuation:$("#fval").value,note:$("#fnote").value.trim()};
    const miss=[!d.program&&"Performed Program",!d.time&&"Time Management",!d.judgement&&"Judgement",!d.valuation&&"Valuation"].filter(Boolean);
    if(miss.length){$("#ferr").textContent="Please fill: "+miss.join(", ");return}
    const btn=$("#fsave");btn.disabled=true;btn.textContent="Saving…";
    try{await api("saveResult",cred,d);evalId="";evalStudent=null;render();toast("Saved");refresh();}
    catch(e){btn.disabled=false;btn.textContent="Save";$("#ferr").textContent="Could not save. Check the internet and try again.";}
  };
}
let scanStream=null,scanTimer=null,zxReader=null;
async function startScan(){
  const sc=$("#scanner"),v=$("#vid"),msg=$("#smsg");
  msg.textContent="Point the camera at the barcode";sc.classList.add("on");
  const done=txt=>{stopScan();setStudent(txt);};
  try{
    if("BarcodeDetector" in window){
      scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
      v.srcObject=scanStream;await v.play();
      const det=new BarcodeDetector();
      const tick=async()=>{if(!scanStream)return;try{const r=await det.detect(v);if(r&&r.length){done(r[0].rawValue);return}}catch(e){}scanTimer=setTimeout(tick,250)};
      tick();
    }else if(window.ZXing){
      zxReader=new ZXing.BrowserMultiFormatReader();
      await zxReader.decodeFromConstraints({video:{facingMode:"environment"}},v,res=>{if(res)done(res.getText())});
    }else msg.textContent="Scanner could not load. Type the ID instead.";
  }catch(e){msg.textContent=(e&&e.name==="NotAllowedError")?"Camera permission was denied. Allow camera access, or type the ID.":"Camera could not start. Type the ID instead.";}
}
function stopScan(){
  clearTimeout(scanTimer);try{zxReader&&zxReader.reset()}catch(e){}zxReader=null;
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
  const v=$("#vid");try{v.pause();v.srcObject=null}catch(e){}
  $("#scanner").classList.remove("on");
}
$("#scClose").onclick=stopScan;
</script>
</body>
</html>
