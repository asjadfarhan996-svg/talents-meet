<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talents Meet</title>
<meta name="theme-color" content="#1f2f7a">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{
  /* SADA palette — light */
  --bg:#eef4f8; --surface:#ffffff; --text:#16224f; --muted:#56637f; --line:#d3dfe9;
  --navy:#1f2f7a; --teal:#0f6b68; --rose:#b0175f;
  --pri:#1f2f7a; --pri-ink:#ffffff; --chip-ink:#ffffff;
  --ok:#1f8a54; --ok-ink:#ffffff; --warn:#9a6b00; --bad:#c0392b; --bad-ink:#ffffff;
  --panel:color-mix(in srgb,var(--surface) 55%,transparent);
  --card:color-mix(in srgb,var(--surface) 52%,transparent);
  --display:"Marcellus",Georgia,"Times New Roman",serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1428; --surface:#17224a; --text:#e7ecf8; --muted:#a3afc9; --line:#26345c;
  --navy:#a9bbff; --teal:#5fd1c9; --rose:#f07aae;
  --pri:#a9bbff; --pri-ink:#0d1428; --chip-ink:#06201e;
  --ok:#5fbf8a; --ok-ink:#06210f; --warn:#e0b04b; --bad:#e07a6b; --bad-ink:#2a0b06; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1428; --surface:#17224a; --text:#e7ecf8; --muted:#a3afc9; --line:#26345c;
  --navy:#a9bbff; --teal:#5fd1c9; --rose:#f07aae;
  --pri:#a9bbff; --pri-ink:#0d1428; --chip-ink:#06201e;
  --ok:#5fbf8a; --ok-ink:#06210f; --warn:#e0b04b; --bad:#e07a6b; --bad-ink:#2a0b06; color-scheme:dark}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(40vmax 40vmax at 8% 12%,color-mix(in srgb,var(--teal) 22%,transparent),transparent 70%),
             radial-gradient(38vmax 38vmax at 92% 30%,color-mix(in srgb,var(--rose) 16%,transparent),transparent 70%),
             radial-gradient(45vmax 45vmax at 50% 100%,color-mix(in srgb,var(--navy) 18%,transparent),transparent 70%)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--body);isolation:isolate;-webkit-tap-highlight-color:transparent}
.serif{font-family:var(--display)}
button{font:inherit;cursor:pointer}
.screen{display:none;min-height:100vh;min-height:100dvh}
.screen.on{display:flex}
/* splash */
#splash{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;
  background:radial-gradient(90% 60% at 50% 0%,color-mix(in srgb,var(--teal) 18%,transparent),transparent 75%)}
.kicker{font-size:12px;letter-spacing:.18em;color:var(--muted);font-weight:700}
.portal{font-family:var(--display);color:var(--rose);font-size:19px;margin-top:6px}
.logo-ring{width:190px;height:190px;border-radius:50%;margin:34px 0 26px;padding:6px;
  background:conic-gradient(from 200deg,var(--teal) 0 28%,transparent 28% 100%);position:relative}
.logo-ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid color-mix(in srgb,var(--teal) 55%,transparent)}
.logo-ring img{width:100%;height:100%;border-radius:50%;display:block;background:#fff;object-fit:cover;box-shadow:0 0 0 4px var(--bg)}
#splash h1{font-family:var(--display);font-weight:400;font-size:38px;margin:0 0 10px;color:var(--navy);letter-spacing:.04em}
.motto{font-family:var(--display);font-style:italic;color:var(--muted);margin:0 0 30px}
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:700;background:var(--pri);color:var(--pri-ink)}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--navy);font-weight:600}
.copy{margin-top:40px;font-size:12px;color:var(--muted)}
/* login */
#login{flex-direction:column;justify-content:center;padding:24px 22px;max-width:480px;margin:0 auto}
#login h2{font-family:var(--display);font-weight:400;color:var(--navy);text-align:center;font-size:30px;margin:0 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 26px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:13px 14px;font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 2px color-mix(in srgb,var(--teal) 25%,transparent)}
textarea{min-height:80px;resize:vertical}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
.full{width:100%;margin-top:22px}
.center{text-align:center;margin-top:16px}
/* app */
#app{flex-direction:column;height:100vh;height:100dvh;overflow:hidden;position:relative}
.top{background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:0;z-index:2}
.top h3{margin:0;font-family:var(--display);font-weight:400;font-size:21px;color:var(--navy)}
.link{background:none;border:0;color:var(--teal);font-weight:700;font-size:14px;padding:4px}
.main{flex:1;overflow-y:auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom,0px));max-width:680px;width:100%;margin:0 auto}
.group{color:var(--muted);font-size:14px;margin:16px 2px 8px}
.card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;color:inherit}
button.card:active{background:color-mix(in srgb,var(--teal) 10%,transparent)}
.nm{font-family:var(--display);font-size:17px;color:var(--navy)}
.id{font-size:12px;color:var(--muted);margin-top:3px}
.chip{background:var(--teal);color:var(--chip-ink);font-weight:700;font-size:12px;padding:3px 10px;border-radius:20px;white-space:nowrap}
.done{font-size:11px;color:var(--ok);margin-top:3px}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;
  display:flex;gap:4px;padding:4px;max-width:560px;margin:0 auto;
  background:color-mix(in srgb,var(--surface) 45%,transparent);border:1px solid var(--line);border-radius:999px;
  box-shadow:0 10px 30px rgba(15,25,60,.22);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%)}
.tabs button{flex:1;background:none;border:0;border-radius:999px;color:var(--text);padding:4px 0 3px;font-size:12px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .18s,color .18s}
.tabs button.on{color:var(--teal);background:color-mix(in srgb,var(--teal) 16%,transparent)}
.tabs svg{width:20px;height:20px}
.res{display:block}
.res .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:5px;gap:12px}
.res .row span:last-child{color:var(--text);text-align:right}
.res .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px}
.note{font-size:12px;color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:8px;padding:8px 10px;margin:8px 0}
/* sheet */
.sheet{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.on{display:flex}
.sheet .box{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:8px 14px;font-size:14px}
.opt.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:700}
.del{background:none;border:0;color:var(--bad);font-size:12px;padding:6px 0 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ok);color:var(--ok-ink);padding:10px 18px;border-radius:20px;font-weight:700;display:none;z-index:20}
@media (prefers-reduced-motion:no-preference){.sheet .box{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
.scanrow{display:flex;gap:8px;align-items:stretch;margin-top:4px}
.scanrow input{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em}
.cam{background:var(--pri);border:0;border-radius:8px;width:54px;display:flex;align-items:center;justify-content:center;color:var(--pri-ink)}
.cam svg{width:26px;height:26px}
.sugg{margin-top:6px}
.sugg button{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 12px;margin-bottom:6px;font-size:14px}
.sugg small{color:var(--muted);margin-left:6px}
input[readonly]{color:var(--muted);background:color-mix(in srgb,var(--bg) 70%,transparent)}
.req{color:var(--rose)}
.formcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px 16px;margin-top:14px}
.btnrow{display:flex;gap:10px;margin-top:20px}.btnrow .btn{flex:1}
#scanner{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column}
#scanner.on{display:flex}
#scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
.frame{position:absolute;left:10%;right:10%;top:35%;height:22%;border:3px solid #5fd1c9;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
.scanbar{padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:#000;text-align:center}
.scanmsg{color:#ddd;font-size:14px;margin-bottom:12px;min-height:20px}
.entries{display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px}
.danger{background:var(--bad);color:var(--bad-ink)}
.meetbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.mstep{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--navy);font-size:26px;font-weight:700;line-height:1}
.mrow{cursor:pointer}
.mrow.ok{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.mrow.ok .chip{background:var(--ok);color:var(--ok-ink)}
.mprog{height:8px;border-radius:999px;background:color-mix(in srgb,var(--teal) 15%,transparent);margin-top:10px;overflow:hidden}
.mprog span{display:block;height:100%;background:var(--teal);border-radius:999px}
.who{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;padding:14px;margin:6px 0 4px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
</head>

<script>
const PROGRAMS=["Supplication","Qira'th","Welcome Speech","Presidency","Inauguration","Report","Malayalam Speech","Spiritual Talk","Arabic Speech","English Speech","Urdu Speech","Song","Zero Hour","Other"];
const TIMES=["Finished","Not Finished","Over Time"];
const JUDGES=["Very Poor","Poor","Average","Amazing","Just Awesome"];
const VALS=["1/10","2/10","3/10","4/10","5/10","6/10","7/10","8/10","9/10","10/10"];
const CLASSES=["Degree 1","Plus Two","Plus One"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tab="students",q="",evals=[],loaded=false,STUDENTS=[],role="",me=null,cred=null,pendingRole="",evalId="",evalStudent=null,poll=null;

const API_URL="https://script.google.com/macros/s/AKfycbzmEQWkmiGs-QqkJM1qVEFcWyxTO0jERK_hrHfdNZ1qOkKFJ31Bg_sf7zdtSlJ9IGRaJw/exec";
async function api(fn,...args){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args})});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||"Error");
  return j.data;
}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));}
function saveSess(){try{localStorage.setItem("tm_sess",JSON.stringify(cred))}catch(e){}}
function clearSess(){try{localStorage.removeItem("tm_sess")}catch(e){}}
function loadSess(){try{return JSON.parse(localStorage.getItem("tm_sess")||"null")}catch(e){return null}}
function toast(t){const el=$("#toast");el.textContent=t;el.style.display="block";setTimeout(()=>el.style.display="none",1600)}

async function refresh(){
  try{evals=await api("getResults",cred);loaded=true;if($("#app").classList.contains("on")&&tab!=="evaluate")render();}catch(e){}
}
function enterApp(r){
  role=r.role;me=r.me;STUDENTS=r.students||[];
  const isUser=role==="user";
  $(".tabs").style.display=isUser?"none":"flex";
  $("#adminTab").style.display=role==="admin"?"flex":"none";
  $("#meetTab").style.display=(role==="staff"||role==="admin")?"flex":"none";
  document.querySelector('.tabs [data-t="students"]').style.display=role==="staff"?"none":"flex";
  tab=isUser?"mine":(role==="staff"?"meet":"students");q="";loaded=false;evals=[];
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.t===tab));
  show("app");render();refresh();
  clearInterval(poll);poll=setInterval(refresh,20000);
}
document.querySelectorAll("[data-role]").forEach(b=>b.onclick=async()=>{
  const s=loadSess();
  if(s&&s.role===b.dataset.role){try{cred=s;enterApp(await api("login",s));return}catch(e){clearSess()}}
  pendingRole=b.dataset.role;
  $("#roleName").textContent={admin:"Admin Entry",staff:"Staff Entry",user:"User Entry"}[pendingRole];
  $("#roleHint").textContent=pendingRole==="user"?"Username is your number in class. Password is your full name.":"Only recognised evaluators can enter student records.";
  $("#u").value="";$("#p").value="";$("#lerr").textContent="";
  $("#u").inputMode=pendingRole==="user"?"numeric":"text";
  show("login");
});
$("#back").onclick=()=>show("splash");
$("#doLogin").onclick=async()=>{
  const c={role:pendingRole,u:$("#u").value.trim(),p:$("#p").value};
  const btn=$("#doLogin");btn.disabled=true;btn.textContent="Checking…";$("#lerr").textContent="";
  try{const r=await api("login",c);cred=c;saveSess();$("#p").value="";enterApp(r);}
  catch(e){$("#lerr").textContent="Wrong username or password.";}
  btn.disabled=false;btn.textContent="Log in";
};
$("#p").addEventListener("keydown",e=>{if(e.key==="Enter")$("#doLogin").click()});
$("#logout").onclick=()=>{clearInterval(poll);role="";me=null;cred=null;clearSess();evalId="";evalStudent=null;show("splash");};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{fromMeet=null;tab=b.dataset.t;q="";document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));render();$("#main").scrollTop=0;if(tab!=="evaluate")refresh();});

function resultCard(e,canDel){
  return `<div class="card res"><div class="head"><div><div class="nm">${esc(e.name)}</div><div class="id">${esc(e.sid)} · ${esc(e.cls)}</div></div><span class="chip">${esc(e.valuation)}</span></div>
    <div class="row"><span>Program</span><span>${esc(e.program)}</span></div>
    <div class="row"><span>Time management</span><span>${esc(e.time)}</span></div>
    <div class="row"><span>Judgement</span><span>${esc(e.judgement)}</span></div>
    <div class="row"><span>Valuation</span><span>${esc(e.valuation)}</span></div>
    <div class="row"><span>Note</span><span>${esc(e.note||"-")}</span></div>
    <div class="row"><span>Recorded</span><span>${new Date(e.at).toLocaleString()}</span></div>
    ${canDel?`<button class="del" data-del="${esc(e._id)}">Delete</button>`:""}</div>`;
}
function searchBox(ph){return `<input id="q" placeholder="${ph}" value="${esc(q)}" style="margin-top:4px">`}
function match(s){const t=q.trim().toLowerCase();return !t||s.name.toLowerCase().includes(t)||s.id.toLowerCase().includes(t)}
function bindSearch(){const i=$("#q");if(!i)return;i.oninput=()=>{q=i.value;const p=i.selectionStart;render();const j=$("#q");j.focus();j.setSelectionRange(p,p)}}
function studentList(){
  let h="";
  for(const c of CLASSES){
    const list=STUDENTS.filter(s=>s.cls===c&&match(s));
    if(!list.length)continue;
    h+=`<div class="group">${c} (${list.length})</div>`+list.map(s=>`<div class="card"><div><div class="nm">${esc(s.name)}</div><div class="id">${s.id}</div></div><span class="chip">${c}</span></div>`).join("");
  }
  return h||`<div class="empty">No student found.</div>`;
}
function render(){
  const m=$("#main");
  if(tab==="mine"){
    $("#ttl").textContent="My Result";
    const mine=evals.slice().sort((a,b)=>b.at-a.at);
    m.innerHTML=`<div class="who"><div class="nm" style="font-size:19px">${esc(me.name)}</div><div class="id">${me.id} · ${me.cls}</div></div>`+
      (!loaded?`<div class="empty">Loading…</div>`:mine.length?mine.map(e=>resultCard(e,false)).join(""):`<div class="empty">No result yet.</div>`);
    return;
  }
  if(tab==="admin"&&role==="admin"){
    $("#ttl").textContent="Admin";
    m.innerHTML=`<div class="who"><div class="nm">Saved results</div><div class="id" style="font-size:15px;margin-top:6px">${loaded?evals.length:"…"}</div></div>
      <div class="who"><div class="nm">Reset data</div><p class="sub" style="margin:6px 0 12px">Deletes every saved result. Student list is not changed.</p>
      <button class="btn danger full" id="resetBtn" style="margin-top:0">Reset all results</button></div>`;
    $("#resetBtn").onclick=resetAll;return;
  }
  if(tab==="meet"){$("#ttl").textContent="Meet Programme";m.innerHTML=meetView();bindMeet();return;}
  if(tab==="students"){$("#ttl").textContent="Students";m.innerHTML=searchBox("Search by name or ID")+studentList();}
  else if(tab==="evaluate"){$("#ttl").textContent="Evaluate Program";m.innerHTML=evalView();bindEval();return;}
  else{$("#ttl").textContent="Check Result";
    const t=q.trim().toLowerCase();
    const list=evals.filter(e=>!t||e.name.toLowerCase().includes(t)||e.sid.toLowerCase().includes(t)||e.program.toLowerCase().includes(t)).sort((a,b)=>b.at-a.at);
    m.innerHTML=searchBox("Search result by name or ID")+(!loaded?`<div class="empty">Loading…</div>`:list.length?list.map(e=>resultCard(e,role==="admin")).join(""):`<div class="empty">No results yet.</div>`);
    m.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delEval(b.dataset.del));
  }
  bindSearch();
}
async function delEval(id){
  if(!confirm("Delete this result?"))return;
  try{await api("deleteResult",cred,id);toast("Deleted");refresh();}catch(e){alert("Could not delete.")}
}
async function resetAll(){
  if(!confirm("Delete ALL results? This cannot be undone."))return;
  if(prompt("Type RESET to confirm")!=="RESET")return;
  const b=$("#resetBtn");b.disabled=true;b.textContent="Deleting…";
  try{await api("resetAll",cred);evals=[];toast("All results deleted");}catch(e){alert("Could not reset.")}
  render();
}


/* ---------- Staff: meet programme ---------- */
let meetNo=1,meetRows=[],fromMeet=null;
try{meetNo=Math.max(1,parseInt(localStorage.getItem("tm_meet")||"1",10)||1)}catch(e){}
const PMAP={"Supplication":"Supplication","Qira'at":"Qira'th","Welcome":"Welcome Speech","Presidency":"Presidency","Report":"Report",
  "Sermon":"Spiritual Talk","Malayalam Speech 1":"Malayalam Speech","Malayalam Speech 2":"Malayalam Speech","English Speech 1":"English Speech",
  "English Speech 2":"English Speech","Arabic Speech":"Arabic Speech","Urdu Speech":"Urdu Speech","Song 1":"Song","Song 2":"Song","Song 3":"Song"};
const normN=s=>String(s||"").toUpperCase().replace(/[^A-Z]/g,"");
function byName(name){
  const n=normN(name);let hit=STUDENTS.filter(s=>normN(s.name)===n);
  if(hit.length===1)return hit[0];
  const toks=String(name).toUpperCase().split(/[^A-Z]+/).filter(w=>w.length>=3);
  hit=STUDENTS.filter(s=>{const sn=normN(s.name);return toks.length&&toks.every(w=>sn.indexOf(w)>-1)});
  return hit.length===1?hit[0]:null;
}
function isDone(st,prog,label){
  if(!st)return false;const today=new Date().toDateString();
  return evals.some(e=>e.sid===st.id&&e.program===prog&&new Date(e.at).toDateString()===today&&(prog!=="Other"||String(e.note||"").indexOf(label)>-1));
}
function meetView(){
  if(!window.tmData)return `<div class="empty">Loading…</div>`;
  meetRows=[];let total=0,done=0,body="";
  window.tmData(meetNo).forEach(g=>{
    if(g.empty)return;
    body+=`<div class="group">${esc(g.cat)} · ${esc(g.plain)}</div>`;
    g.rows.forEach(r=>{
      r.who.forEach(name=>{
        const st=byName(name),prog=PMAP[r.label]||"Other",note=PMAP[r.label]?"":r.label,ok=isDone(st,prog,r.label);
        total++;if(ok)done++;const k=meetRows.push({st,prog,note,label:r.label,name})-1;
        body+=`<button class="card mrow${ok?" ok":""}" data-k="${k}"><div style="min-width:0"><div class="id">${esc(r.no==="★"?"★ ":r.no==="*"?"* ":r.no+". ")}${esc(r.label)}</div><div class="nm">${esc(name)}</div>${st?"":`<div class="id" style="color:var(--warn)">Not in student list – scan the ID card</div>`}</div><span class="chip">${ok?"✔ Done":"Evaluate"}</span></button>`;
      });
    });
  });
  const pct=total?Math.round(done*100/total):0;
  return `<div class="meetbar"><button class="mstep" data-d="-1" aria-label="Previous meet">−</button><div style="text-align:center"><div class="id">Meet number</div><div class="nm" style="font-size:24px">Meet ${meetNo}</div></div><button class="mstep" data-d="1" aria-label="Next meet">+</button></div>
    <div class="who" style="margin-top:12px"><div class="nm">${done} of ${total} evaluated today</div><div class="mprog"><span style="width:${pct}%"></span></div><div class="id" style="margin-top:6px">Tap a name to evaluate. Done items get a ✔.</div></div>`+(body||`<div class="empty">No programme list.</div>`);
}
function bindMeet(){
  document.querySelectorAll(".mstep").forEach(b=>b.onclick=()=>{meetNo=Math.max(1,meetNo+(+b.dataset.d));try{localStorage.setItem("tm_meet",meetNo)}catch(e){}render();});
  document.querySelectorAll(".mrow").forEach(b=>b.onclick=()=>{
    const r=meetRows[+b.dataset.k];if(!r)return;
    fromMeet=r;evalId=r.st?r.st.id:"";evalStudent=r.st;tab="evaluate";
    document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.t==="evaluate"));
    render();$("#main").scrollTop=0;
    if(evalStudent){$("#fprog").value=r.prog;if(r.note)$("#fnote").value=r.note;}
  });
}
function backToMeet(){if(!fromMeet)return false;fromMeet=null;tab="meet";document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.t==="meet"));render();return true;}

function sel(id,arr){return `<select id="${id}"><option value="">Select</option>${arr.map(v=>`<option>${esc(v)}</option>`).join("")}</select>`}
function findStudent(v){v=String(v||"").trim().toUpperCase();if(!v)return null;
  const ex=STUDENTS.find(s=>s.id===v);if(ex)return ex;
  const m=v.match(/^[A-Z]{6,}(\d{5,})$/);if(!m)return null;
  const n=parseInt(m[1],10);return STUDENTS.find(s=>parseInt(s.id.replace(/\D/g,""),10)===n)||null}
function evalView(){
  const camIcon=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`;
  return `<label for="eid" style="margin-top:6px">Student ID</label>
  <div class="scanrow"><input id="eid" placeholder="Scan barcode or type ID" value="${esc(evalId)}" autocapitalize="characters" autocomplete="off"><button class="cam" id="camBtn" aria-label="Scan barcode">${camIcon}</button></div>
  <div class="err" id="iderr"></div><div class="sugg" id="sugg"></div>
  ${evalStudent?`<div class="formcard">
    <label for="fprog">Performed Program <span class="req">*</span></label>${sel("fprog",PROGRAMS)}
    <label for="ftime">Time Management <span class="req">*</span></label>${sel("ftime",TIMES)}
    <label for="fjudge">Judgement <span class="req">*</span></label>${sel("fjudge",JUDGES)}
    <label for="fval">Valuation <span class="req">*</span></label>${sel("fval",VALS)}
    <label for="fnote">Additional Note</label><textarea id="fnote" placeholder="Optional"></textarea>
    <label for="fname">Student Name</label><input id="fname" readonly value="${esc(evalStudent.name)}">
    <div class="err" id="ferr"></div>
    <div class="btnrow"><button class="btn ghost" id="fcancel">Cancel</button><button class="btn" id="fsave">Save</button></div>
  </div>`:`<div class="empty">Tap the camera and scan the student's barcode.</div>`}`;
}
function setStudent(v){
  evalId=String(v||"").trim().toUpperCase();evalStudent=findStudent(evalId);render();
  if(!evalStudent&&evalId)$("#iderr").textContent="No student with this ID: "+evalId;
}
function bindEval(){
  const inp=$("#eid");
  inp.oninput=()=>{
    const v=inp.value.trim().toUpperCase();evalId=inp.value;
    if(findStudent(v)){setStudent(v);return}
    if(evalStudent){evalStudent=null;const p=inp.selectionStart;render();const j=$("#eid");j.focus();j.setSelectionRange(p,p);}
    const sg=$("#sugg");const l=v.toLowerCase();
    const list=l.length>=2?STUDENTS.filter(s=>s.id.toLowerCase().includes(l)||s.name.toLowerCase().includes(l)).slice(0,5):[];
    sg.innerHTML=list.map(s=>`<button data-id="${s.id}">${esc(s.id)}<small>${esc(s.name)}</small></button>`).join("");
    sg.querySelectorAll("button").forEach(b=>b.onclick=()=>setStudent(b.dataset.id));
  };
  $("#camBtn").onclick=startScan;
  if(!evalStudent)return;
  $("#fcancel").onclick=()=>{evalId="";evalStudent=null;if(!backToMeet())render()};
  $("#fsave").onclick=async()=>{
    const d={sid:evalStudent.id,program:$("#fprog").value,time:$("#ftime").value,judgement:$("#fjudge").value,valuation:$("#fval").value,note:$("#fnote").value.trim()};
    const miss=[!d.program&&"Performed Program",!d.time&&"Time Management",!d.judgement&&"Judgement",!d.valuation&&"Valuation"].filter(Boolean);
    if(miss.length){$("#ferr").textContent="Please fill: "+miss.join(", ");return}
    const btn=$("#fsave");btn.disabled=true;btn.textContent="Saving…";
    try{await api("saveResult",cred,d);evalId="";evalStudent=null;toast("Saved");await refresh();if(!backToMeet())render();}
    catch(e){btn.disabled=false;btn.textContent="Save";$("#ferr").textContent="Could not save. Check the internet and try again.";}
  };
}
let scanStream=null,scanTimer=null,zxReader=null;
async function startScan(){
  const sc=$("#scanner"),v=$("#vid"),msg=$("#smsg");
  msg.textContent="Point the camera at the barcode";sc.classList.add("on");
  const done=txt=>{stopScan();setStudent(txt);};
  try{
    if("BarcodeDetector" in window){
      scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
      v.srcObject=scanStream;await v.play();
      const det=new BarcodeDetector();
      const tick=async()=>{if(!scanStream)return;try{const r=await det.detect(v);if(r&&r.length){done(r[0].rawValue);return}}catch(e){}scanTimer=setTimeout(tick,250)};
      tick();
    }else if(window.ZXing){
      zxReader=new ZXing.BrowserMultiFormatReader();
      await zxReader.decodeFromConstraints({video:{facingMode:"environment"}},v,res=>{if(res)done(res.getText())});
    }else msg.textContent="Scanner could not load. Type the ID instead.";
  }catch(e){msg.textContent=(e&&e.name==="NotAllowedError")?"Camera permission was denied. Allow camera access, or type the ID.":"Camera could not start. Type the ID instead.";}
}
function stopScan(){
  clearTimeout(scanTimer);try{zxReader&&zxReader.reset()}catch(e){}zxReader=null;
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
  const v=$("#vid");try{v.pause();v.srcObject=null}catch(e){}
  $("#scanner").classList.remove("on");
}
$("#scClose").onclick=stopScan;
</script>

  <button type="button" class="hkfab" id="hkFab" aria-label="Ask Hikma" title="Ask Hikma"><span class="hk"></span></button>
  <div class="hkpanel" id="hkPanel" role="dialog" aria-label="Hikma, SADA assistant">
    <div class="hktop"><span class="hk"></span><div style="flex:1"><b>Hikma</b><small>SADA Assistant · online</small></div><button type="button" class="hkx" id="hkX" aria-label="Close">✕</button></div>
    <div class="hkchat" id="hkChat" aria-live="polite"></div>
    <div class="hkchips" id="hkChips"></div>
    <form class="hkask" id="hkForm"><label for="hkIn" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Message</label><input id="hkIn" autocomplete="off" placeholder="Ask anything about SADA..."><button type="submit">Send</button></form>
  </div>
</div>
<script>
(function(){
  var API='https://script.google.com/macros/s/AKfycby3WzCd27PRGqyH_v8l05cvq-7ZhP08n1CekzDU1gX66VEbHLUqallLhpudfSv_bkWE0A/exec';
  var SITE='https://sada-daruswalah.github.io', TM='https://asjadfarhan996-svg.github.io/talents-meet/',
      LIB='https://script.google.com/macros/s/AKfycbwJsA03dol83EPQMcDFspl0lx8Hn_Oqt9s-wa0aGsLTzk-qjIqlzpbBOgtYe7wvkBOD4w/exec';
  var g=function(id){return document.getElementById(id)};
  var fab=g('hkFab'),panel=g('hkPanel'),chat=g('hkChat'),inp=g('hkIn');
  function e(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
  function link(u,t){return '<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>'}
  var students=null;
  function getStudents(){
    if(students) return Promise.resolve(students);
    return fetch(API).then(function(r){return r.json()}).then(function(j){students=j.students||[];return students});
  }
  function add(html,who){
    var b=document.createElement('div');b.className='bub '+who;b.innerHTML=html;
    if(who==='ai'){var w=document.createElement('div');w.className='airow';w.innerHTML='<span class="hk"></span>';w.appendChild(b);chat.appendChild(w)}
    else chat.appendChild(b);
    chat.scrollTop=chat.scrollHeight;return b;
  }

  /* ---- Talents Meet weekly schedule ---- */
  var TM_ON=true;
  var TM_GROUPS=[
    {name:'Plus Two &amp; Degree',plain:'PLUS TWO & DEGREE',cat:'S1',report1:'ASJAD FARHAN',list:['IBRAHIM .A','MUHAMMED NAEEM','ADIL ROSHAN','MUHAMMED BISHR','MUHAMMED SHAMMAS','MUHAMMED MINHAJ','MUHAMMED FARHAN','MUHAMMED SHAFI','NAJIH ABDULLAH','MUHAMMED SAHAL','AL AMEEN','SHAHDAN AHMED','HADI AMAN','SINAN KASARAGOD','SINAN KALARANTHIRI','ASJAD FARHAN','MUHAMMED RIDWAN','MUHAMMED AYMAN']},
    {name:'Plus One',plain:'PLUS ONE',cat:'S2',report1:'',list:['MUHAMMED NADHISH','MUHAMMAD C K','MUHAMMED JUNAID','SINAN NARIKKUNI','ADNAN K','SINAN PK KALARANTHIRI','AMJAD AC','MUHAMMED RAMZAN','MUHAMMED P','MUHAMMED HASAN SALIH','MUHAMMAD JINSHAD','MUHAMMED AMIN','MUHAMMED NAFIH','MUHAMMAD SUHAIL','MUHAMMAD SHAHIN','MUHAMMAD RISAL','ANAS ELAMARAM']}
  ];
  /* slot = rotating position; 'none' = nobody; 'report' = previous presidency */
  var TM_PROGS=[['*','Supplication',0],['1',"Qira'at",1],['2','Welcome',2],['3','Presidency',0],['4','Inauguration','none'],['5','Dissertation',3],['6','Sermon',4],
    ['7','Malayalam Speech 1',5],['8','Malayalam Speech 2',6],['9','English Speech 1',7],['10','English Speech 2',8],['11','Arabic Speech',9],['12','Urdu Speech',10],
    ['13','Song 1',11],['14','Song 2',12],['15','Song 3',13],['★','Special Program','special'],['16','Zero Hour','none'],['17','Report','report'],['18','Criticism','none'],['19','Vote of Thanks',14]];
  var TM_SLOTS=15;
  function tmPerson(list,day,slot){
    var N=list.length; if(!N||slot>=N) return '';
    return list[(slot+day-1)%N];
  }
  var TM_MIN={'Supplication':3,"Qira'at":2,'Welcome':5,'Presidency':5,'Inauguration':5,'Dissertation':3,'Sermon':10,'Malayalam Speech 1':5,'Malayalam Speech 2':5,
    'English Speech 1':3,'English Speech 2':3,'Arabic Speech':3,'Urdu Speech':3,'Song 1':4,'Song 2':4,'Song 3':4,'Zero Hour':5,'Report':3,'Criticism':10,'Vote of Thanks':1};
  function tmData(day){
    return TM_GROUPS.map(function(g){
      var out={name:g.name,plain:g.plain,cat:g.cat,rows:[],empty:!g.list.length};
      if(out.empty) return out;
      var rep=day===1?g.report1:tmPerson(g.list,day-1,0), busy={};
      if(rep) busy[rep]=1;
      TM_PROGS.forEach(function(p){if(typeof p[2]==='number'){var x=tmPerson(g.list,day,p[2]);if(x)busy[x]=1}});
      var spare=g.list.filter(function(n){return !busy[n]});
      out.rows=TM_PROGS.map(function(p){
        var who=p[2]==='none'?[]:p[2]==='report'?(rep?[rep]:[]):p[2]==='special'?spare:[tmPerson(g.list,day,p[2])];
        return {no:p[0],label:p[1],who:who.filter(Boolean),min:TM_MIN[p[1]]||''};
      });
      return out;
    });
  }
  window.tmData=tmData;
  function tmSchedule(day){
    var h='<b>Weekly Talent Meet · Meet '+day+'</b>';
    tmData(day).forEach(function(g){
      h+='<div class="tmg"><div class="tmh">'+g.name+' · '+g.cat+'</div>';
      if(g.empty){h+='<div class="tmn">Student list not added yet.</div></div>';return}
      h+='<table class="tmt"><tbody>'+g.rows.map(function(r){
        return '<tr><td class="no">'+r.no+'</td><td>'+r.label+'</td><td class="nm">'+(r.who.length?r.who.map(e).join('<br>'):'<span class="dash">—</span>')+'</td></tr>';
      }).join('')+'</tbody></table></div>';
    });
    h+='<button type="button" class="tmdl" data-meet="'+day+'">⬇ Download PDF (4 pages)</button>';
    return h;
  }

  /* ---- PDF of the programme sheets ---- */
  var jsPdfP=null;
  function loadJsPdf(){
    if(window.jspdf) return Promise.resolve(window.jspdf);
    if(jsPdfP) return jsPdfP;
    jsPdfP=new Promise(function(res,rej){
      var sc=document.createElement('script');
      sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      sc.onload=function(){window.jspdf?res(window.jspdf):rej(new Error('PDF tool did not load'))};
      sc.onerror=function(){jsPdfP=null;rej(new Error('PDF tool did not load'))};
      document.head.appendChild(sc);
    });
    return jsPdfP;
  }
  function tmPdf(day){
    return loadJsPdf().then(function(lib){
      var doc=new lib.jsPDF({unit:'mm',format:'a4'});
      var NAVY=[31,45,80],ROSE=[194,24,91],BG=[211,229,244],CREAM=[250,246,232],CREAMLINE=[214,204,160];
      function fill(c){doc.setFillColor(c[0],c[1],c[2])}
      function ink(c){doc.setTextColor(c[0],c[1],c[2])}
      function stroke(c){doc.setDrawColor(c[0],c[1],c[2])}
      function shape(color,start,curves,close){
        var segs=[],x=start[0],y=start[1];
        curves.forEach(function(c){
          if(c.length===2){segs.push([c[0]-x,c[1]-y]);x=c[0];y=c[1]}
          else{segs.push([c[0]-x,c[1]-y,c[2]-x,c[3]-y,c[4]-x,c[5]-y]);x=c[4];y=c[5]}
        });
        fill(color);doc.lines(segs,start[0],start[1],[1,1],'F',true);
      }
      function frame(){
        fill([255,255,255]);doc.rect(0,0,210,297,'F');
        fill(BG);doc.rect(5.5,5.5,199,286,'F');
      }
      function border(){stroke([60,70,95]);doc.setLineWidth(0.3);doc.rect(10.5,10.5,189,276,'S')}
      function arrow(x1,y1,x2,y2){
        stroke([60,70,95]);doc.setLineWidth(0.3);doc.line(x1,y1,x2,y2);
        fill([60,70,95]);var d=x2>x1?1:-1;doc.triangle(x2,y2,x2-2.4*d,y2-1.3,x2-2.4*d,y2+1.3,'F');
      }
      function fitText(t,x,y,maxW,size){
        doc.setFontSize(size);while(doc.getTextWidth(t)>maxW&&size>7){size-=0.5;doc.setFontSize(size)}
        doc.text(t,x,y);
      }
      function rowsOn(rows,y0,step,lineX,labelSize){
        rows.forEach(function(r,i){
          var y=y0+i*step;
          doc.setFont('times','bold');doc.setFontSize(labelSize);
          var lab=r.label.toUpperCase(), no=(r.no==='*'||r.no==='★')?'* ':r.no+'. ';
          var wl=doc.getTextWidth(lab), wn=doc.getTextWidth(no);
          ink(NAVY);doc.text(lab,lineX-5,y,{align:'right'});
          ink(r.no==='*'?NAVY:ROSE);doc.text(no.trim(),lineX-5-wl-wn-0.8,y);
          ink(NAVY);doc.setFont('times','normal');doc.setFontSize(12);doc.text(':',lineX+3,y);
          doc.setFont('times','bold');
          var who=r.who.length?r.who.join(', '):'';
          if(who) fitText(who,lineX+7,y,180-(lineX+7)-18,12);
          doc.setFontSize(11);if(r.min!=='') doc.text(r.min+' MIN',182,y,{align:'right'});
          stroke([60,70,95]);doc.setLineWidth(0.25);doc.line(lineX,y+5,182,y+5);
        });
      }
      tmData(day).forEach(function(g,gi){
        if(g.empty) return;
        var p1=g.rows.slice(0,7), p2=g.rows.slice(7);
        /* ---------- page 1 ---------- */
        if(gi>0) doc.addPage();
        frame();
        shape([181,215,241],[5.5,5.5],[[204.5,5.5],[204.5,108],[170,95,150,80,128,79],[108,78,95,96,72,104],[50,112,25,96,5.5,94]]);
        shape([62,147,219],[5.5,5.5],[[204.5,5.5],[204.5,88],[175,74,150,60,125,62],[100,64,95,88,72,92],[45,96,25,82,5.5,80]]);
        shape([106,172,229],[5.5,5.5],[[204.5,5.5],[204.5,40],[170,28,140,26,110,36],[85,44,50,46,5.5,38]]);
        border();
        ink(NAVY);doc.setFont('times','bold');doc.setFontSize(9);doc.text('Sl No :  '+day,14,17);
        fill([236,239,243]);doc.rect(45,25,120,11,'F');
        fill(NAVY);doc.rect(45,25,3,11,'F');doc.rect(162,25,3,11,'F');
        ink(NAVY);doc.setFont('times','normal');doc.setFontSize(22);doc.text('WEEKLY TALENT MEET',105,33,{align:'center'});
        fill(NAVY);doc.rect(81.5,37.5,47,6.5,'F');
        ink([255,255,255]);doc.setFontSize(11.5);doc.text('Do Your Best And Beyond',105,42.1,{align:'center'});
        ink([36,62,110]);doc.setFontSize(10);doc.setCharSpace(0.9);doc.text('SNEC • DARUSWALAH ISLAMIC ACADEMY',105,53,{align:'center'});doc.setCharSpace(0);
        ink(ROSE);doc.setFont('times','bold');doc.setFontSize(12);doc.text('CATEGORY :',18,67.4);
        [['S1',46,20],['S2',70,20],['GNR',94,28]].forEach(function(c){
          var on=c[0]===g.cat;
          fill(on?NAVY:[255,255,255]);stroke([160,180,200]);doc.setLineWidth(0.3);doc.roundedRect(c[1],62.5,c[2],7.5,1,1,'FD');
          ink(on?[255,255,255]:NAVY);doc.setFont('times',on?'bold':'normal');doc.setFontSize(12);doc.text(c[0],c[1]+c[2]/2,67.6,{align:'center'});
        });
        ink(ROSE);doc.setFont('times','bold');doc.text('DATE :',128,67.4);
        fill([255,255,255]);doc.roundedRect(144,62,38,8.5,1,1,'FD');
        ink(NAVY);doc.setFontSize(9);doc.setFont('times','normal');doc.text(g.plain,182,75.5,{align:'right'});
        ink(NAVY);doc.setFont('times','bold');doc.setFontSize(13);doc.text('THEME :',25,105);
        fill(CREAM);stroke(CREAMLINE);doc.roundedRect(46,95,136,17,2.5,2.5,'FD');
        arrow(66,124,17,124);stroke([60,70,95]);doc.line(66,124,66,266);arrow(66,266,123,266);
        rowsOn(p1,135,13,66,13);
        fill(CREAM);stroke(CREAMLINE);doc.roundedRect(70,229,112,25,2.5,2.5,'FD');
        /* ---------- page 2 ---------- */
        doc.addPage();
        frame();
        shape([122,182,232],[5.5,5.5],[[204.5,5.5],[204.5,73],[180,62,150,42,128,47],[108,52,95,82,72,80],[50,78,25,64,5.5,66]]);
        shape([168,207,240],[5.5,5.5],[[204.5,5.5],[204.5,33],[170,22,140,20,110,30],[85,37,50,40,5.5,33]]);
        border();
        ink(NAVY);doc.setFont('times','normal');doc.setFontSize(9);doc.text('Sl No :  '+day+'   ·   '+g.cat+' · '+g.plain,14,17);
        arrow(74,22,17,22);stroke([60,70,95]);doc.line(74,22,74,232);arrow(74,232,140,232);
        rowsOn(p2,33,14.2,74,11.5);
      });
      doc.save('Talent-Meet-'+day+'.pdf');
    });
  }
  function has(q,words){return words.some(function(w){return q.indexOf(w)>-1})}
  var CLS=['PLUS ONE','PLUS TWO','DEGREE 1'];
  function countReply(q){
    return getStudents().then(function(list){
      var by={};list.forEach(function(s){var c=String(s.cls||'').toUpperCase();by[c]=(by[c]||0)+1});
      var one=CLS.filter(function(c){return q.indexOf(c.toLowerCase())>-1||q.indexOf(c.toLowerCase().replace(' ',''))>-1})[0];
      if(one) return 'There are <b>'+(by[one]||0)+'</b> student(s) in <b>'+one+'</b> in the SADA register.';
      return 'The SADA register has <b>'+list.length+'</b> student(s):<ul>'+CLS.map(function(c){return '<li>'+c+': <b>'+(by[c]||0)+'</b></li>'}).join('')+'</ul>';
    });
  }
  function nameReply(q){
    return getStudents().then(function(list){
      var words=q.toUpperCase().replace(/[^A-Z. ]/g,' ').split(/\s+/).filter(function(w){return w.length>=4});
      var hits=list.filter(function(s){var n=String(s.name||'').toUpperCase();return words.some(function(w){return n.split(/[\s.]+/).indexOf(w.replace(/\./g,''))>-1||n===w})});
      if(!hits.length) return null;
      return hits.slice(0,5).map(function(s){return '<b>'+e(s.name)+'</b> is a SADA member: '+e(s.cls)+', Roll '+e(s.roll||'—')+'.'}).join('<br>');
    });
  }
  function answer(raw){
    var tmm=raw.match(/talents?\s*meet\s*@\s*(\d{1,3})/i);
    if(tmm&&+tmm[1]>0) return TM_ON?tmSchedule(+tmm[1]):'The weekly programme list is available on the '+link(TM,'Talents Meet')+' website. Ask Hikma there.';
    var q=' '+raw.toLowerCase().trim()+' ';
    if(has(q,[' hi ',' hello',' hai ',' salam','assalam','salaam',' hey '])) return 'Wa alaikum assalam! 😊 I am <b>Hikma</b>, the SADA assistant. Ask me about SADA, our Chairman, goals, wings, students, Talents Meet or the library.';
    if(has(q,['thank','thanks','nanni','jazak'])) return 'You are welcome! Ask me anything else about SADA. 😊';
    if(has(q,['chairman','president','leader','naeem','naim','head of sada'])) return 'The Chairman of SADA is <b>Muhammad Naeem</b>. His message to students: learn with sincerity, live with discipline and serve with a smile. He invites every student to take part, stay active and make SADA proud.';
    if(has(q,['full form','stand for','stands for','meaning of sada','what is sada','about sada','sada enthan','sada entha',' sada?'])) return '<b>SADA</b> stands for <b>Students Association of Daruswalah Academy</b>. It is the official student body of the Academy and brings every student together to learn, lead and serve, guided by faith, knowledge and good character.';
    if(has(q,['vision'])) return '<b>Our Vision:</b> to raise a generation of students who are rooted in faith, rich in knowledge, disciplined in conduct and ready to serve society with sincerity.';
    if(has(q,['mission'])) return '<b>Our Mission:</b> to nurture leadership, creativity and responsibility in every student through organised programmes, a culture of reading, and a spirit of unity and service.';
    if(has(q,['goal','aim','objective','lakshyam'])) return '<b>Vision:</b> students rooted in faith, rich in knowledge, disciplined and ready to serve.<br><b>Mission:</b> nurture leadership, creativity and responsibility through programmes, reading and unity.';
    if(has(q,['value','principle'])) return 'SADA\'s core values are <b>Faith, Knowledge, Discipline, Unity, Leadership, Service, Respect</b> and <b>Excellence</b>.';
    if(has(q,['pledge','motto','slogan'])) return 'Our motto is <b>Knowledge · Discipline · Service</b>.<br>The SADA Pledge: <i>"Together we learn, together we lead, and together we serve."</i>';
    if(has(q,['wing','department','activit','work','programme','program ','what does sada do'])) return 'SADA works through six wings:<ul><li><b>Academic</b> – study circles, quizzes, revision</li><li><b>Literary &amp; Arts</b> – speeches, essays, poetry, calligraphy</li><li><b>Spiritual</b> – prayers, dhikr, moral classes</li><li><b>Library &amp; Reading</b> – Digital Library, reading campaigns</li><li><b>Discipline &amp; Assembly</b> – morning assembly</li><li><b>Sports &amp; Welfare</b> – games and student wellbeing</li></ul>';
    if(has(q,['ithihad','ittihad','ithihad'])) return '<b>ITHIHAD</b> is one of SADA\'s class unions. It has no website yet.';
    if(has(q,['irthiva','irtiqa','irthiqa'])) return '<b>IRTHIVA</b> is one of SADA\'s class unions. '+link('https://irthiva.my.canva.site/','Visit IRTHIVA');
    if(has(q,['intilaq','inthilaq','intilak'])) return '<b>INTILAQ</b> is one of SADA\'s class unions. Its motto: <i>New Beginnings, Limitless Possibilities</i>. '+link('https://sites.google.com/view/inthilaq/home','Visit INTILAQ');
    if(has(q,['union'])) return 'SADA has three class unions:<ul><li><b>ITHIHAD</b> – no website yet</li><li><b>IRTHIVA</b> – '+link('https://irthiva.my.canva.site/','website')+'</li><li><b>INTILAQ</b> – '+link('https://sites.google.com/view/inthilaq/home','website')+'</li></ul>You can also find them on the SADA website under <b>OTHER</b>.';
    if(has(q,['finance','fee','money','account','fund','panam','cash'])) return 'Ha! The <b>FINANCE</b> button on the website is shy and runs away when you touch it 😄 Finance records are not public yet.';
    if(has(q,['password','username','login','log in','sign in'])) return 'Login details are given only to SADA admins and office bearers. Please ask the Chairman or the Academy office.';
    if(has(q,['add student','register','join','admission','new member','enroll','enrol'])) return 'Admins add students on the SADA website: tap <b>OTHER → Add Students</b> and log in. There you can also View, Edit and Delete students. '+link(SITE,'Open SADA website');
    if(TM_ON&&has(q,['schedule','duty','who is presenting','programme list','program list'])) return 'Type <b>Talents meet@</b> with the meet number to see who presents what. For example: <b>Talents meet@1</b>';
    if(has(q,['talent','evaluat','result','mark','score','valuation'])) return '<b>Talents Meet</b> is where staff evaluate student programmes (Qira\'th, speeches, songs and more) and students check their results. '+link(TM,'Open Talents Meet');
    if(has(q,['library','book','read'])) return 'The <b>Daruswalah Digital Library</b> lets students see their book history, and librarians issue and return books by scanning barcodes. '+link(LIB,'Open Digital Library');
    if(has(q,['website','link','site','url','portal'])) return 'The official SADA website is '+link(SITE,'sada-daruswalah.github.io')+'.';
    if(has(q,['academy','daruswalah','daru swalah','darussalam'])) return 'SADA is the students\' association of <b>Daruswalah Academy</b>. Every student of the Academy is a member of SADA.';
    if(has(q,['how many','count','total','number of','ethra','plus one','plus two','degree','student','member'])) return countReply(q);
    return nameReply(raw).then(function(r){return r||'I am not sure about that yet. I can tell you about:<ul><li>What SADA is</li><li>Our Chairman</li><li>Vision, mission and values</li><li>SADA wings</li><li>Class unions</li><li>Number of students</li><li>Talents Meet and the Library</li></ul>Try asking one of these!'});
  }
  var busy=false;
  function ask(text){
    text=String(text||inp.value).trim(); if(!text||busy) return;
    add(e(text),'me'); inp.value=''; busy=true;
    var w=add('<i>typing...</i>','ai');
    Promise.resolve().then(function(){return answer(text)}).then(function(r){
      setTimeout(function(){w.innerHTML=r;chat.scrollTop=chat.scrollHeight;busy=false},350);
    }).catch(function(){w.innerHTML='Sorry, I could not reach the SADA register. Check the internet and try again.';busy=false});
  }
  var CHIPS=['What is SADA?','Who is the chairman?','Class unions','How many students?'];
  g('hkChips').innerHTML=CHIPS.map(function(c){return '<button type="button">'+c+'</button>'}).join('');
  chat.addEventListener('click',function(ev){
    var b=ev.target.closest('.tmdl'); if(!b||b.disabled) return;
    var t=b.textContent; b.disabled=true; b.textContent='Preparing PDF…';
    tmPdf(+b.dataset.meet).then(function(){b.textContent='✔ Downloaded'}).catch(function(err){b.textContent='Could not make the PDF. Check the internet and tap again.';b.disabled=false})
      .then(function(){setTimeout(function(){if(b.textContent==='✔ Downloaded'){b.textContent=t;b.disabled=false}},3000)});
  });
  g('hkChips').addEventListener('click',function(ev){var b=ev.target.closest('button');if(b)ask(b.textContent)});
  g('hkForm').addEventListener('submit',function(ev){ev.preventDefault();ask()});
  add('Assalamu alaikum! I am <b>Hikma</b> 😊 Ask me anything about <b>SADA</b> — our Chairman, goals, wings, class unions, students, Talents Meet or the library.','ai');
  function toggle(open){if(open===undefined)open=!panel.classList.contains('show');panel.classList.toggle('show',open);fab.classList.toggle('open',open);if(open){chat.scrollTop=chat.scrollHeight;inp.focus()}}
  fab.addEventListener('click',function(){toggle()});
  if(TM_ON){
    var appEl=document.getElementById('app'), wrap=fab.closest('.hkw');
    var sync=function(){var on=!!(appEl&&appEl.classList.contains('on'));wrap.hidden=!on;if(!on&&panel.classList.contains('show'))toggle(false)};
    if(appEl){new MutationObserver(sync).observe(appEl,{attributes:true,attributeFilter:['class']})}
    sync();
  }
  g('hkX').addEventListener('click',function(){toggle(false);fab.focus()});
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&panel.classList.contains('show'))toggle(false)});
})();
</script>
